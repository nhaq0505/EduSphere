# ============================================================
# EduSphere — Application Configuration
# ============================================================

# --- Server ---
server.port=8080
server.servlet.context-path=/EduSphere

# --- JSP View Resolver ---
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# --- SQL Server DataSource ---
spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=EduSphere;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# validate: kiểm tra schema khớp với entity, KHÔNG tạo/sửa table
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Tắt Open-in-View để tránh performance issues
spring.jpa.open-in-view=false

# --- File Upload (Avatar) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Avatar upload directory (thay đổi path theo máy bạn nếu cần)
app.upload.dir=${user.home}/edusphere/uploads/avatars

# --- Spring Mail (Gmail SMTP) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dangconghoangnhat@gmail.com
