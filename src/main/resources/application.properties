spring.config.import=optional:file:./config/application-local.properties
# EduSphere local configuration
server.port=8080
server.servlet.context-path=/EduSphere

server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-exception=false

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.jsp.init-parameters.development=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.url=jdbc:sqlserver://127.0.0.1:1435;databaseName=EduSphere;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=sa
spring.datasource.password=${EDUSPHERE_DB_SA_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
app.upload.base-dir=${user.home}/edusphere/uploads
app.upload.dir=${user.home}/edusphere/uploads/avatars

# --- Bunny Stream ---
bunny.stream.library-id=${BUNNY_LIBRARY_ID:}
bunny.stream.api-key=${BUNNY_API_KEY:}
bunny.stream.api-url=https://video.bunnycdn.com
bunny.stream.player-url=https://player.mediadelivery.net
bunny.stream.webhook-secret=${BUNNY_WEBHOOK_SECRET:}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.test-connection=false

app.base-url=${APP_BASEURL:http://localhost:8080/EduSphere}
app.email-verification.expiration-minutes=1440
app.password-reset.expiration-minutes=30


logging.level.com.edusphere=DEBUG
logging.level.org.springframework.security=DEBUG

# --- PayOS Configuration ---
payos.client-id=${PAYOS_CLIENT_ID:}
payos.api-key=${PAYOS_API_KEY:}
payos.checksum-key=${PAYOS_CHECKSUM_KEY:}

# --- AI RAG Question Bank Configuration ---
ai.rag.api-key=${AI_RAG_API_KEY:}
ai.rag.model=gemini-2.5-flash



# ==============================
# EDUSPHERE AI CONFIGURATION
# ==============================

# FFmpeg executable
ffmpeg.path=${FFMPEG_PATH:ffmpeg}

# AI processing
ai.processing.enabled=true
ai.processing.chunk-minutes=8
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
