# EduSphere local configuration
server.port=8080
server.servlet.context-path=/EduSphere

server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-exception=true

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
server.jsp.init-parameters.development=true

spring.datasource.url=jdbc:sqlserver://127.0.0.1:1433;databaseName=EduSphere;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
app.upload.base-dir=${user.home}/edusphere/uploads
app.upload.dir=${user.home}/edusphere/uploads/avatars

